name: CI

on:
  pull_request:
    branches: [main, V1.2]
  push:
    branches: [main, V1.2]

jobs:
  lint:
    name: Lint (ESLint + Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --legacy-peer-deps
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --legacy-peer-deps
      - run: npm test

  build-check:
    name: Build-Test (statische Dateien)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Pruefe, dass zentrale Dateien vorhanden und syntaktisch valide sind
        run: |
          node --check js/app.js
          node --check js/storage.js
          node --check js/autocomplete.js
          test -f index.html
          test -f css/style.css
          echo "Build-Check erfolgreich"
